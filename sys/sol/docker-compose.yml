services:
  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:10.10.7
    restart: unless-stopped
    network_mode: host
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card1:/dev/dri/card1
    group_add:
      - "989"   # render (host GID, Arch-specific — keep in sync if host rebuilt)
      - "985"   # video
    volumes:
      - ~/srv/jellyfin/config:/config
      - ~/srv/jellyfin/cache:/cache
      - /mnt/pool:/media

  transmission:
    container_name: transmission
    image: lscr.io/linuxserver/transmission:4.0.5
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
    volumes:
      - ~/srv/transmission/config:/config
      - /mnt/pool:/mnt/pool
