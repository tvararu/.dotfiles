# Incus host configuration for sol. Apply once, on a fresh install:
#
#   incus admin init --preseed < sys/sol/incus-preseed.yml
#
# Storage is `dir` on the NVMe rather than the ZFS pool: the pool is raidz1 on
# spinning disks, which is the wrong medium for compile workloads, and a second
# zpool (loop-backed) would add another ARC consumer to a 6.9 GiB host. Instances
# here are disposable — sys/luna/cloud-init.yml is the durable record, so losing
# snapshots costs nothing.
#
# `/` is only 18 GB, so storage must live under /home (201 GB).
config:
  # No background image re-downloads; images are pinned by whatever is on disk.
  images.auto_update_interval: "0"

networks:
  - name: incusbr0
    type: bridge
    config:
      # 10.100.0.0/24 avoids the LAN (192.168.1.0/24), docker0 (172.17.0.0/16)
      # and the tailnet (100.64.0.0/10). Pinned rather than `auto` so the docs
      # and any ssh config stay valid across a rebuild.
      ipv4.address: 10.100.0.1/24
      ipv4.nat: "true"
      # sol has public, un-NATted IPv6. Handing guests a routable address would
      # put them straight on the internet — off entirely.
      ipv6.address: none

storage_pools:
  - name: local
    driver: dir
    config:
      # Must exist and be empty before init: sudo mkdir -p /home/incus
      source: /home/incus

profiles:
  - name: default
    devices:
      root:
        path: /
        pool: local
        type: disk
      eth0:
        name: eth0
        network: incusbr0
        type: nic
