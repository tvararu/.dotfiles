# Pin the project name so it does not vary with the invocation directory.
name: t1

services:
  comfyui:
    container_name: comfyui
    image: mmartial/comfyui-nvidia-docker:ubuntu24_cuda13.1-latest
    restart: unless-stopped
    ports:
      - "8188:8188"
    volumes:
      - ~/srv/comfyui:/comfy/mnt
      - ~/models:/host_models
    environment:
      - WANTED_UID=1000
      - WANTED_GID=1000
      - USE_UV=true
      - FORCE_CHOWN=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  transmission:
    container_name: transmission
    image: linuxserver/transmission:4.0.5
    restart: unless-stopped
    network_mode: host
    volumes:
      - ~/srv/transmission/config:/config
      - ~/downloads:/downloads
      - ~/media:/media
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
      - USER=${TRANSMISSION_USER}
      - PASS=${TRANSMISSION_PASS}

  jellyfin:
    container_name: jellyfin
    image: linuxserver/jellyfin:latest
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - ~/srv/jellyfin:/config
      - ~/media:/data/media
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # yt-dlp proof-of-origin token provider, used by the Jellyfin YouTube library.
  bgutil-pot:
    container_name: bgutil-pot
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:4416:4416"

  # MQTT broker for t1's own health metrics (see t1-metrics.service). Bound to
  # loopback: the publisher runs on the host and Home Assistant is host-networked,
  # so nothing crosses the LAN and no ufw rule is needed.
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ~/.dotfiles/sys/t1/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ~/srv/mosquitto/passwd:/mosquitto/config/passwd:ro
      - ~/srv/mosquitto/data:/mosquitto/data
    environment:
      - TZ=Europe/London

  # host networking is required: HomeKit pairing and the HomeKit Bridge both need
  # mDNS, and a published port cannot carry multicast. Exposure is gated by ufw.
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    network_mode: host
    volumes:
      - ~/srv/homeassistant:/config
      - /run/dbus:/run/dbus:ro
      - /etc/localtime:/etc/localtime:ro
    # HA auto-discovers hci0 whether or not we intend to use Bluetooth, and
    # without dbus and these caps it retries a failing scanner forever. Granting
    # them silences that and keeps the BLE path available as a fallback.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TZ=Europe/London

  aitoolkit:
    container_name: aitoolkit
    image: ostris/aitoolkit:latest
    restart: unless-stopped
    shm_size: "16gb"
    ports:
      - "8675:8675"
    volumes:
      - ~/srv/aitoolkit/hf-cache:/root/.cache/huggingface
      - ~/srv/aitoolkit/aitk_db.db:/app/ai-toolkit/aitk_db.db
      - ~/srv/aitoolkit/datasets:/app/ai-toolkit/datasets
      - ~/srv/aitoolkit/output:/app/ai-toolkit/output
      - ~/srv/aitoolkit/config:/app/ai-toolkit/config
    environment:
      - NODE_ENV=production
      - TZ=Europe/London
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Qwopus 27B dense, Claude-distilled. Manual start: docker compose up -d llama-qwopus
  llama-qwopus:
    container_name: llama-qwopus
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    restart: unless-stopped
    profiles: ["qwopus"]
    ports:
      - "100.73.138.96:8001:8001"
    volumes:
      - ~/srv/llama-server/cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      -hf Jackrong/Qwopus3.6-27B-v2-MTP-GGUF:Q4_K_M
      -ngl 99 -fa on --parallel 1 --no-mmproj
      --host 0.0.0.0 --port 8001
      --spec-type draft-mtp --spec-draft-n-max 6
      --temp 1.0 --top-p 0.95

  # Qwen3.6 35B-A3B MoE, fast. Manual start: docker compose up -d llama-qwen36-a3b
  # (stop llama-qwopus first — both bind port 8001 and can't share VRAM)
  llama-qwen36-a3b:
    container_name: llama-qwen36-a3b
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    restart: unless-stopped
    profiles: ["a3b"]
    ports:
      - "100.73.138.96:8001:8001"
    volumes:
      - ~/srv/llama-server/cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      -hf unsloth/Qwen3.6-35B-A3B-MTP-GGUF:UD-Q4_K_XL
      -ngl 99 -fa on --parallel 1 --no-mmproj
      --host 0.0.0.0 --port 8001
      --spec-type draft-mtp --spec-draft-n-max 6
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.00 --presence-penalty 1.5

  # Qwen3.8 27B dense, smartest but ~3x slower than the A3B (all params active).
  # Manual start: docker compose up -d llama-qwen38
  # (stop the other two first — all three bind 8001 and can't share VRAM)
  llama-qwen38:
    container_name: llama-qwen38
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    restart: unless-stopped
    profiles: ["qwen38"]
    ports:
      - "100.73.138.96:8001:8001"
    volumes:
      - ~/srv/llama-server/cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # image bakes in a healthcheck against :8080; we serve on :8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 10m
      retries: 3
    command: >
      -m /root/.cache/huggingface/hub/models--unsloth--Qwen3.8-27B-GGUF/snapshots/f1bfb127c64f7072bdd2cad55f258b9c8b2910fe/Qwen3.8-27B-UD-Q4_K_XL.gguf
      --offline
      -ngl 99 -fa on --parallel 1 --no-mmproj
      --host 0.0.0.0 --port 8001
      -c 262144 --cache-type-k q4_0 --cache-type-v q4_0
      --spec-type draft-mtp --spec-draft-n-max 3
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.00 --presence-penalty 0.0
