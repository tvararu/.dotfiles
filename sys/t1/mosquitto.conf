# Broker for host metrics published by t1-metrics.service, consumed by Home
# Assistant. Docker binds this to 127.0.0.1 only, so the listener below is
# reachable from the host and from host-networked containers but nowhere else.
listener 1883

# Credentials from the start even though the listener is loopback-only: adding
# sol later means opening this to the tailnet, and retrofitting auth would mean
# reconfiguring HA's MQTT integration by hand.
allow_anonymous false
password_file /mosquitto/config/passwd

# Retained discovery and state messages must survive a broker restart, or HA
# loses every entity until the next publish cycle.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type warning
log_type error
